[project]
name = "downloader-bot"
version = "1.0.0"
description = "Telegram bot that downloads videos from YouTube and 1000+ other sites in the quality you choose."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=bot --cov-report=term-missing"

[tool.coverage.run]
omit = ["bot/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Russian texts in bot/i18n.py use Cyrillic letters that look like Latin ones.
ignore = ["RUF001", "RUF002"]
